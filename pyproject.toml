[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportkit"
version = "0.1.0"
description = "Black-box test kit for report / search / statistics screens: independent SQL expectations vs what the app shows, declarative UI checks, KBKT workbook output"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "oracledb>=2.0",
  "playwright>=1.35",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rt = "reportkit.cli:main"

[tool.setuptools.packages.find]
include = ["reportkit*"]

[tool.setuptools.package-data]
reportkit = ["assets/*", "assets/**/*"]
